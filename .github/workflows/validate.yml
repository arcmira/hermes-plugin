name: Validate plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.os }}, ${{ matrix.hermes.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        hermes:
          - name: stable-0.22.2
            sha: d923a5eb487a17c0a68801bba9ef0f56c81040a8
          - name: stable-0.23.0
            sha: 2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19
          - name: stable-0.23.1
            sha: 3b421578588243f920886e6fe79a6faa87ea026e
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          path: plugin
          persist-credentials: false
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.hermes.sha }}
          path: hermes
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.py
            /agent/
            /gateway/
            /hermes_cli/
            /hermes_platform/
            /tools/
            /pm/
            /scripts/validate_plugin_catalog.py
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install locked test dependencies
        run: python -m pip install --require-hashes -r plugin/requirements-dev.txt
      - name: Run package checks against Hermes
        run: python plugin/scripts/test.py --hermes-source hermes
